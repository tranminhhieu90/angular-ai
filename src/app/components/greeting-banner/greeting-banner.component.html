<div class="greeting-banner">
  <!-- Decorative circles -->
  <div class="banner-circle banner-circle--1"></div>
  <div class="banner-circle banner-circle--2"></div>
  <div class="banner-circle banner-circle--3"></div>

  <!-- Text content -->
  <div class="banner-content">
    <p class="banner-hello">{{ greeting().text }} {{ greeting().emoji }}</p>
    <h2 class="banner-title">Hôm nay học gì nào, {{ displayName() }}?</h2>
    <p class="banner-streak">Bạn đang có streak {{ streak }} ngày liên tiếp 🔥</p>
  </div>

  <!-- Mascot -->
  <div class="banner-mascot">
    <img src="assets/images/logo.png" alt="Wapple mascot" />
  </div>
</div>
