<app-auth-page-layout>
  <section
    class="relative flex min-h-screen w-full flex-1 items-center justify-center overflow-y-auto bg-[linear-gradient(180deg,#d4f1ff_0%,#fff8e7_48%,#ffe8f4_100%)] px-4 py-10 text-[#1a4a7a] sm:px-6 lg:w-1/2"
  >
    <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
      <div
        class="absolute inset-0 opacity-[0.35] [background-image:radial-gradient(circle,rgba(26,74,122,0.12)_1.5px,transparent_1.5px)] [background-size:28px_28px]"
      ></div>
      <span
        class="absolute top-16 right-[8%] size-20 rounded-full bg-[radial-gradient(circle_at_35%_35%,#ffe566,#ffb347)] shadow-[0_0_0_10px_rgba(255,194,51,0.18),0_0_48px_rgba(255,179,71,0.4)] max-sm:size-14"
      ></span>
      <span
        class="absolute top-36 left-[8%] h-8 w-20 rounded-full bg-white/85 shadow-[-24px_7px_0_-4px_rgba(255,255,255,0.85),24px_6px_0_-6px_rgba(255,255,255,0.75),0_8px_20px_rgba(76,201,240,0.15)]"
      ></span>
      <span
        class="absolute bottom-[18%] left-[12%] size-10 rounded-full border-[3px] border-white/70 bg-[rgba(0,180,216,0.28)] backdrop-blur-[2px]"
      ></span>
      <span
        class="absolute right-[14%] bottom-[24%] text-2xl text-[#ff5ca8] [text-shadow:0_0_12px_rgba(255,194,51,0.55)]"
        >★</span
      >
    </div>

    <div class="relative z-1 w-full max-w-[460px]">
      <div
        class="rounded-[28px] border-2 border-[rgba(0,180,216,0.22)] bg-white/[.9] p-6 shadow-[0_24px_60px_rgba(0,180,216,0.18),0_8px_24px_rgba(255,140,26,0.1)] backdrop-blur sm:p-8"
      >
        <div class="mb-6 sm:mb-8">
          <h1
            class="mb-3 text-[clamp(1.75rem,4vw,2.5rem)] font-extrabold leading-tight text-[#1a4a7a]"
          >
            Đăng nhập
          </h1>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
          <div>
            <label tuiLabel>
              <div class="flex items-baseline font-bold text-[#1a4a7a]">
                Email <span class="ml-1 text-[#ff5ca8]">*</span>
              </div>
              <tui-textfield tuiTextfieldSize="m">
                <input
                  tuiTextfield
                  type="email"
                  formControlName="email"
                  placeholder="info@gmail.com"
                />
              </tui-textfield>
            </label>
            @if (emailError) {
              <p class="mt-1 text-sm font-semibold text-red-500">{{ emailError }}</p>
            }
          </div>

          <div>
            <label tuiLabel>
              <div class="flex items-baseline font-bold text-[#1a4a7a]">
                Mật khẩu <span class="ml-1 text-[#ff5ca8]">*</span>
              </div>
              <tui-textfield tuiTextfieldSize="m">
                <input
                  tuiTextfield
                  [attr.type]="showPassword ? 'text' : 'password'"
                  formControlName="password"
                  placeholder="Nhập mật khẩu"
                />
                <tui-icon
                  [icon]="showPassword ? '@tui.eye-off' : '@tui.eye'"
                  (click)="togglePasswordVisibility()"
                  style="cursor: pointer"
                />
              </tui-textfield>
            </label>
            @if (passwordError) {
              <p class="mt-1 text-sm font-semibold text-red-500">{{ passwordError }}</p>
            }
          </div>

          <div class="flex flex-wrap items-center justify-between gap-3">
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                style="--tui-border-normal: rgba(0, 180, 216, 0.35)"
                tuiCheckbox
                type="checkbox"
                formControlName="rememberMe"
              />
              <span class="text-sm font-semibold text-[#4a6280]">Giữ đăng nhập</span>
            </label>
            <a
              routerLink="/reset-password"
              class="text-sm font-extrabold text-[#00b4d8] hover:text-[#0096b8]"
            >
              Quên mật khẩu?
            </a>
          </div>

          @if (errorMessage()) {
            <div
              class="rounded-2xl border border-red-400/25 bg-red-50 px-4 py-3 text-sm font-semibold text-red-500"
            >
              {{ errorMessage() }}
            </div>
          }

          <button
            tuiButton
            type="submit"
            size="m"
            class="w-full rounded-full! bg-[#00b4d8]! text-base! font-extrabold! text-white! shadow-[0_8px_28px_rgba(0,180,216,0.28)]! hover:bg-[#0096b8]!"
            [disabled]="isSubmitting()"
          >
            {{ isSubmitting() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
          </button>

          <div class="relative flex items-center gap-3">
            <div class="h-px flex-1 bg-[rgba(0,180,216,0.18)]"></div>
            <span class="text-xs font-extrabold uppercase tracking-[0.12em] text-[#4a6280]/70"
              >Hoặc</span
            >
            <div class="h-px flex-1 bg-[rgba(0,180,216,0.18)]"></div>
          </div>

          <button
            tuiButton
            type="button"
            size="m"
            appearance="glass"
            class="inline-flex w-full items-center justify-center gap-3 rounded-full! border-2! border-[rgba(0,180,216,0.25)]! bg-white! py-3 text-base! font-extrabold! text-[#1a4a7a]!"
          >
            <app-icon-google [size]="36" />
            Đăng nhập với Google
          </button>
        </form>

        <div class="mt-6">
          <p class="text-center text-sm font-semibold text-[#4a6280]">
            Chưa có tài khoản?
            <a routerLink="/signup" class="font-extrabold text-[#ff8c1a] hover:text-[#ff5ca8]">
              Đăng ký
            </a>
          </p>
        </div>
      </div>
    </div>
  </section>
</app-auth-page-layout>
